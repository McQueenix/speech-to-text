# One-click deploy on Render: New → Blueprint → pick this repo.
# Creates a free PostgreSQL database and a web service wired to it.
databases:
  - name: speech-to-text-db
    plan: free
    databaseName: speech_to_text
    user: stt

services:
  - type: web
    name: speech-to-text
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: speech-to-text-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false   # Render asks you to paste it during setup
